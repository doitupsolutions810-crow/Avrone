[project]
name = "avrone"
version = "0.6.0"
description = "AVRONE: self-hosted multi-agent chat and search with Grok Heavy style orchestration, built on OpenClaw"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio"]

[project.scripts]
avrone = "avrone.server:main"
avrone-cli = "avrone.cli:main"
avrone-mcp = "avrone.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["avrone*"]

[tool.setuptools.package-data]
avrone = ["static/*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
