# Base44 development environment for AVRONE.
#
#   web (avrone)  FastAPI server + bundled UI + REST + WebSocket HUD, run FROM THE
#                 CLONED SOURCE with uvicorn --reload, on host port 3000.
#   ollama        local OpenAI-compatible model backend, so the app works with no
#                 external credentials. Point the app at a hosted provider instead
#                 (xAI / OpenAI / OpenRouter / OpenClaw) by overriding
#                 AVRONE_PROVIDER / AVRONE_LLM_BASE_URL / AVRONE_LLM_MODEL and the
#                 provider's API key in the dashboard secrets — /run/base44/app.env
#                 is read LAST, so those values win over .env.base44-defaults.
#
# Agents execute commands locally inside the web container (AVRONE_RUNNER=local);
# no Docker socket is mounted here.
name: avrone

services:
  ollama:
    image: ollama/ollama:latest
    restart: on-failure
    labels:
      base44.kind: infra
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: fetch the chat model into the shared volume before the server starts.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - ./.env.base44-defaults
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-ec", "ollama pull \"$${AVRONE_LLM_MODEL:-qwen2.5:3b}\""]

  avrone:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /app
    labels:
      base44.project: AVRONE
      base44.kind: web
      base44.port: "3000"
    ports: ["3000:3000"]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    env_file:
      - ./.env.base44-defaults   # local dev defaults; real secrets override them
      - /run/base44/app.env      # platform-managed secrets — always wins (last)
    environment:
      AVRONE_HOST: 0.0.0.0
      AVRONE_PORT: "3000"
      PYTHONUNBUFFERED: "1"
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
    volumes:
      - .:/app                       # live source; edits reload the server
      - pip-cache:/root/.cache/pip
      - avrone-workspace:/app/workspace   # agent sandbox
      - avrone-data:/app/data             # Eternal CodeX run log + snapshots
    command:
      - sh
      - -ec
      - |
        pip install -q -e . || pip install -q fastapi "uvicorn[standard]" httpx
        exec uvicorn avrone.server:app --host 0.0.0.0 --port 3000 --reload --reload-dir /app/avrone
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:3000/api/status', timeout=4)" || exit 1
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 60s

volumes:
  ollama-models:
  pip-cache:
  avrone-workspace:
  avrone-data:
