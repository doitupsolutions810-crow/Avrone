<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AVRONE</title>
<style>
  :root { --bg:#0b0d12; --panel:#12151d; --line:#232838; --text:#e6e8ef; --dim:#8a90a2; --accent:#7cf2c8; --warn:#f2c97c; --err:#f27c7c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:grid; grid-template-rows:auto 1fr; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; letter-spacing:.2em; margin:0; color:var(--accent); }
  header .meta { color:var(--dim); font-size:12px; }
  header #authform { margin-left:auto; padding:0; border:0; align-items:center; }
  header #authform input { height:30px; width:150px; padding:4px 8px; }
  header #authform button { height:30px; padding:0 10px; }
  header #authmsg { font-size:11px; color:var(--dim); max-width:150px; }
  main { display:grid; grid-template-columns: 1fr 380px; min-height:0; }
  #chat { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
  #msgs { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:80%; padding:10px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:#1d2a40; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .bot .agents { margin-top:8px; color:var(--dim); font-size:12px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; height:52px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px; font:inherit; }
  select, button, input { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:0 12px; font:inherit; }
  button { background:var(--accent); color:#06120d; border:0; font-weight:600; cursor:pointer; }
  aside { display:flex; flex-direction:column; min-height:0; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; border-radius:0; background:none; color:var(--dim); padding:10px; }
  .tabs button.on { color:var(--accent); box-shadow: inset 0 -2px var(--accent); }
  .pane { flex:1; overflow:auto; padding:10px; display:none; font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pane.on { display:block; }
  .agent { border:1px solid var(--line); border-radius:8px; padding:6px 8px; margin-bottom:6px; }
  .agent .st { float:right; color:var(--warn); } .agent.done .st { color:var(--accent); }
  .ev { border-bottom:1px dashed var(--line); padding:4px 0; white-space:pre-wrap; word-break:break-word; }
  .ev b { color:var(--accent); } .ev.error b { color:var(--err); }
  #termout { white-space:pre-wrap; }
  .msg.md { white-space:normal; } .msg.md h2,.msg.md h3 { font-size:14px; margin:10px 0 4px; color:var(--accent); } .msg.md h2:first-child { margin-top:0; }
  .msg.md ul { margin:4px 0; padding-left:18px; } .msg.md p { margin:4px 0; } .msg.md a { color:var(--accent); }
  .msg.md code { background:#0b0d12; padding:1px 4px; border-radius:4px; } .msg.md pre { background:#0b0d12; padding:8px; border-radius:6px; overflow:auto; white-space:pre-wrap; }
  .msg details { margin-top:8px; color:var(--dim); font-size:12px; } .msg details div { white-space:pre-wrap; margin-top:4px; }
  .badge { display:inline-block; font-size:11px; padding:1px 6px; border-radius:6px; background:#1d2a40; color:var(--accent); margin-bottom:6px; }
  #fa { display:none; padding:0 12px 0; } #fa textarea { width:100%; height:60px; }
  .tool { border-bottom:1px dashed var(--line); padding:5px 0; } .tool .src { float:right; color:var(--warn); }
  .tool .d { color:var(--dim); white-space:normal; } #extinfo { color:var(--dim); margin-bottom:8px; white-space:pre-wrap; }
  #termform { display:flex; gap:6px; margin-bottom:8px; } #termform input { flex:1; height:32px; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; grid-template-rows: 1fr 40vh; } #chat { border-right:0; } }
</style>
</head>
<body>
<header><h1>AVRONE</h1><span class="meta" id="meta">connecting…</span>
  <form id="authform"><input id="apitok" type="password" autocomplete="current-password" placeholder="API token (remote)" aria-label="API token" /><button>Connect</button><button type="button" id="authlogout">Log out</button></form><span id="authmsg">Local access may not need a token.</span>
</header>
<main>
  <section id="chat">
    <div id="msgs"></div>
    <div id="fa"><textarea id="first" placeholder="Deep mode: paste the first answer to stress-test (optional; leave empty to run a squad first)."></textarea></div>
    <form id="f">
      <textarea id="q" placeholder="Ask anything. Squad mode runs several agents in parallel, then a lead merges them."></textarea>
      <select id="mode"><option value="squad">Squad</option><option value="chat">Chat</option><option value="deep">Deep</option></select>
      <button>Send</button>
    </form>
  </section>
  <aside>
    <div class="tabs">
      <button data-p="hud" class="on">HUD</button><button data-p="logs">Logs</button><button data-p="tools">Tools</button><button data-p="map">Map</button><button data-p="term">Terminal</button>
    </div>
    <div class="pane on" id="hud"></div>
    <div class="pane" id="logs"></div>
    <div class="pane" id="tools"><div id="extinfo"></div><div id="toollist">Loading…</div></div>
    <div class="pane" id="map"><div id="telem">Loading…</div><svg id="mapsvg" width="100%" height="520"></svg>
      <h4>Fleet directory</h4>
      <form id="tellform"><input id="tellagent" placeholder="agent (e.g. router/edge/Builder-3)" /><input id="tellmsg" placeholder="instruction" /><button>Tell</button></form>
      <pre id="fleetdir" style="white-space:pre-wrap;font-size:11px">Needs the admin token (Terminal tab).</pre></div>
    <div class="pane" id="term">
      <form id="termform"><input id="tok" type="password" placeholder="admin token" style="max-width:110px" /><input id="cmd" placeholder="command" /></form>
      <div id="termout"></div>
    </div>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
const agents = {};
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function addMsg(text, cls, extra){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; if(extra){ const a=document.createElement('div'); a.className='agents'; a.textContent=extra; d.appendChild(a);} $('#msgs').appendChild(d); $('#msgs').scrollTop=1e9; return d; }
function renderHud(){ $('#hud').innerHTML = Object.entries(agents).reverse().map(([n,a]) =>
  `<div class="agent ${a.status}"><span class="st">${a.status}</span><b>${esc(n)}</b> ${a.parent?'↳ '+esc(a.parent):''}<br>${esc(a.focus||'').slice(0,140)}<br><span style="color:var(--dim)">${esc(a.last||'')}</span></div>`).join('') || '<span style="color:var(--dim)">No agents yet.</span>'; }
function md(src){
  const blocks = String(src).split(/```/); let html='';
  blocks.forEach((b,i) => { if(i%2){ html += '<pre><code>'+esc(b.replace(/^\w*\n/,''))+'</code></pre>'; return; }
    let inList=false;
    b.split('\n').forEach(line => {
      let t = esc(line).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
      const li = /^\s*[-*]\s+(.*)/.exec(t);
      if(li){ if(!inList){ html+='<ul>'; inList=true; } html+='<li>'+li[1]+'</li>'; return; }
      if(inList){ html+='</ul>'; inList=false; }
      const h = /^(#{1,4})\s+(.*)/.exec(t);
      if(h) html += `<h${Math.min(h[1].length+1,4)}>${h[2]}</h${Math.min(h[1].length+1,4)}>`;
      else if(t.trim()) html += '<p>'+t+'</p>';
    });
    if(inList) html+='</ul>';
  });
  return html;
}
function addReport(j){
  const d=document.createElement('div'); d.className='msg bot md';
  d.innerHTML = '<span class="badge">Deep analysis</span>' + md(j.report||j.answer||'');
  const det=document.createElement('details'); const sm=document.createElement('summary');
  sm.textContent = `first answer · ${(j.agents||[]).length} reviewers: ${(j.agents||[]).map(a=>a.role).join(', ')} · run ${j.run_id}`;
  const body=document.createElement('div'); body.textContent = j.first_answer||''; det.append(sm, body); d.appendChild(det);
  $('#msgs').appendChild(d); $('#msgs').scrollTop=1e9;
}
async function loadTools(){
  try {
    const [tools, ext] = await Promise.all([(await fetch('/api/tools')).json(), (await fetch('/api/extensions')).json()]);
    $('#toollist').innerHTML = tools.map(t => `<div class="tool"><span class="src">${esc(t.source)}</span><b>${esc(t.name)}</b> <span style="color:var(--dim)">${esc(t.args)}</span><div class="d">${esc(t.description)}</div></div>`).join('') || 'No tools.';
    const parts=[]; const p=ext.plugins, m=ext.mcp;
    if(p && p.installed) parts.push('plugins: '+(Array.isArray(p.loaded)? p.loaded.map(x=>(x.name||x)+(x.error?' (error)':'')).join(', ')||'none' : (p.error||'loaded')));
    if(m && m.installed) parts.push('mcp: '+(m.servers && typeof m.servers==='object' ? Object.entries(m.servers).map(([k,v])=>k+(v.connected?' ✓':' ✗')).join(', ')||'none' : (m.error||'none')));
    if(ext.errors && ext.errors.length) parts.push('errors: '+ext.errors.join('; '));
    $('#extinfo').textContent = `${tools.length} tools` + (parts.length? ' · '+parts.join(' · ') : '');
  } catch(e){ $('#toollist').textContent = 'Could not load tools: '+e; }
}
async function status(){ try { const s = await (await fetch('/api/status')).json(); $('#meta').textContent = `runner: ${s.runner} · ${s.provider||''} model: ${s.model} @ ${s.backend} · squad: ${s.squad_size} · tools: ${s.tools??'?'}`; } catch(e){ $('#meta').textContent='offline'; } }
let eventSocket = null;
function ws(){
  const w = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/events');
  eventSocket = w;
  let wasOpen = false;
  w.onopen = () => { wasOpen = true; };
  w.onmessage = m => { const e = JSON.parse(m.data);
    if(e.kind==='agent.spawn') agents[e.agent] = {status:'working', focus:e.data.focus, parent:e.data.parent};
    if(e.kind==='tool.call' && agents[e.agent]) agents[e.agent].last = '→ '+e.data.tool+' '+JSON.stringify(e.data.args).slice(0,80);
    if(e.kind==='agent.done' && agents[e.agent]) { agents[e.agent].status='done'; agents[e.agent].last='finished'; }
    renderHud();
    const d=document.createElement('div'); d.className='ev'+(e.kind==='error'?' error':'');
    const body = e.data.output || e.data.result || e.data.answer || e.data.message || JSON.stringify(e.data);
    d.innerHTML = `<b>${esc(e.kind)}</b> ${esc(e.agent)}\n${esc(String(body).slice(0,1200))}`;
    $('#logs').prepend(d);
  };
  w.onclose = () => { if(wasOpen && eventSocket === w) setTimeout(ws, 1500); };
}
$('#authform').onsubmit = async ev => {
  ev.preventDefault();
  const token = $('#apitok').value;
  if(!token){ $('#authmsg').textContent = 'Enter an API token.'; return; }
  $('#authmsg').textContent = 'Connecting…';
  try {
    const r = await fetch('/api/auth/session', {method:'POST', headers:{'X-API-Token':token}});
    const j = await r.json().catch(() => ({}));
    if(!r.ok){ $('#authmsg').textContent = 'Access denied: '+(j.detail||r.status); return; }
    $('#apitok').value = '';
    $('#authmsg').textContent = j.auth==='off' ? 'API authentication is disabled.' : 'Connected (8-hour session).';
    status(); loadTools();
    const old = eventSocket; eventSocket = null; if(old) old.close();
    ws();
    if($('#map').classList.contains('on')) { loadMap(); loadFleet(); }
  } catch(e) { $('#authmsg').textContent = 'Connection failed: '+e; }
};
$('#authlogout').onclick = async () => {
  try {
    await fetch('/api/auth/session', {method:'DELETE'});
    $('#authmsg').textContent = 'Logged out. Reconnect to continue.';
    const old = eventSocket; eventSocket = null; if(old) old.close();
  } catch(e) { $('#authmsg').textContent = 'Logout failed: '+e; }
};
$('#f').onsubmit = async ev => { ev.preventDefault(); const q=$('#q').value.trim(); if(!q) return; $('#q').value='';
  const mode=$('#mode').value; const payload={message:q, mode};
  if(mode==='deep' && $('#first').value.trim()){ payload.first_answer=$('#first').value.trim(); $('#first').value=''; }
  addMsg(q,'user'); const pending = addMsg(mode==='deep' ? 'Second wave reviewing…' : 'Agents working…','bot');
  try { const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j = await r.json(); pending.remove();
    if(!r.ok){ addMsg('Error: '+(j.detail||r.status),'bot'); return; }
    if(j.mode==='deep'){ addReport(j); return; }
    addMsg(j.answer || JSON.stringify(j), 'bot', j.agents && j.agents.length ? `${j.agents.length} agents: ${j.agents.map(a=>a.role).join(', ')} · run ${j.run_id}` : `run ${j.run_id||''}`);
  } catch(e){ pending.textContent = 'Error: '+e; } };
$('#q').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('#f').requestSubmit(); } });
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { document.querySelectorAll('.tabs button,.pane').forEach(x=>x.classList.remove('on')); b.classList.add('on'); $('#'+b.dataset.p).classList.add('on'); });
$('#mode').onchange = () => { $('#fa').style.display = $('#mode').value==='deep' ? 'block' : 'none'; };
document.querySelector('[data-p=tools]').addEventListener('click', loadTools);
$('#termform').onsubmit = async ev => { ev.preventDefault(); const cmd=$('#cmd').value; $('#cmd').value='';
  const r = await fetch('/api/terminal',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':$('#tok').value},body:JSON.stringify({cmd})});
  const j = await r.json(); $('#termout').textContent = (r.ok ? `$ ${j.cmd}\n${j.stdout}${j.stderr?'\n'+j.stderr:''}\n[exit ${j.exit_code}]` : 'Error: '+(j.detail||r.status)) + '\n\n' + $('#termout').textContent; };

async function loadMap(){
  const [t, g] = await Promise.all([fetch('/api/telemetry').then(r=>r.json()), fetch('/api/map').then(r=>r.json())]);
  const tools = Object.entries(t.tools).slice(0,6).map(([k,v])=>`${k} ${v.calls}${v.errors?' ('+v.errors+' err)':''}`).join(' · ');
  $('#telem').innerHTML = `<b>24h</b> runs ${t.runs.total} (${t.runs.running} live) · p50 ${t.runs.p50_s??'–'}s · agents ${t.agents.spawned} · errors ${t.errors}<br>${esc(tools)}`;
  const kinds = ['node','fleet','core','store','runner','model','toolgroup','agent','tool'];
  const used = new Set(g.edges.filter(e=>e.weight>0).flatMap(e=>[e.from,e.to]));
  const nodes = g.nodes.filter(n => n.kind!=='tool' || used.has(n.id));
  const cols = {}; nodes.forEach(n => (cols[n.kind] = cols[n.kind] || []).push(n));
  const W = $('#mapsvg').clientWidth || 360, colKinds = kinds.filter(k=>cols[k]);
  const pos = {}; colKinds.forEach((k,i) => cols[k].forEach((n,j) => pos[n.id] = {x: 30 + i*(W-60)/Math.max(1,colKinds.length-1), y: 20 + (j+1)*480/(cols[k].length+1)}));
  const color = {node:'#f2f27c',fleet:'#7cf27c',core:'#7cf2c8',store:'#c97cf2',runner:'#f2c97c',model:'#7cb8f2',toolgroup:'#8a90a2',agent:'#f27cb1',tool:'#e6e8ef'};
  let svg = '';
  g.edges.forEach(e => { const a=pos[e.from], b=pos[e.to]; if(!a||!b) return; svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#2c3346" stroke-width="${1+Math.min(5,Math.log2(1+e.weight))}"/>`; });
  nodes.forEach(n => { const p=pos[n.id]; if(!p) return; svg += `<circle cx="${p.x}" cy="${p.y}" r="6" fill="${color[n.kind]||'#fff'}"/><text x="${p.x+8}" y="${p.y+4}" fill="#cfd3de" font-size="10">${esc(n.label).slice(0,26)}</text>`; });
  $('#mapsvg').innerHTML = svg;
}
document.querySelector('[data-p=map]').addEventListener('click', () => { loadMap(); loadFleet(); });
async function loadFleet(){
  const tok = $('#tok').value; if(!tok) return;
  const r = await fetch('/api/fleet/directory', {headers:{'x-admin-token':tok}});
  if(!r.ok){ $('#fleetdir').textContent = 'Fleet: ' + (await r.text()); return; }
  $('#fleetdir').textContent = (await r.json()).map(n => {
    const e = n.env||{}, d = e.device||{}, ru = e.runner||{}, c = ru.container;
    const nets = (e.networks||[]).map(i => i.name+' '+i.addrs.join(',')).join('; ');
    const ag = (n.agents||[]).map(a => `   - ${a.name} (${a.role}) ${a.status}: ${(a.task||'').slice(0,70)}`).join('\n');
    return `[${n.route||'(main)'}] ${n.node_id} ${n.status} | ${d.hostname} ${d.os} | ${ru.kind}${c?' '+c.name:''}\n   nets: ${nets}\n${ag}`;
  }).join('\n\n');
}
$('#tellform').addEventListener('submit', async ev => { ev.preventDefault();
  const r = await fetch('/api/fleet/tell', {method:'POST', headers:{'content-type':'application/json','x-admin-token':$('#tok').value},
    body: JSON.stringify({agent:$('#tellagent').value, message:$('#tellmsg').value})});
  const j = await r.json(); $('#fleetdir').textContent = JSON.stringify(j, null, 2); setTimeout(loadFleet, 3000);
});

renderHud(); status(); ws(); loadTools(); setInterval(status, 10000);
</script>
</body>
</html>
