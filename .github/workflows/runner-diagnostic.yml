name: hosted-runner-diagnostic

on:
  push:
    branches: [squad/round4-hardening-coverage-20261029]
    paths:
      - '.github/workflows/runner-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-24:
    name: hosted runner ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Report runner allocation
        run: |
          echo "RUNNER_LABEL=ubuntu-24.04"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "RUNNER_NAME=$RUNNER_NAME"
          uname -a
          python --version

  ubuntu-latest:
    name: hosted runner ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report runner allocation
        run: |
          echo "RUNNER_LABEL=ubuntu-latest"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "RUNNER_NAME=$RUNNER_NAME"
          uname -a
          python --version

  ubuntu-slim:
    name: hosted runner ubuntu-slim
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Report runner allocation
        run: |
          echo "RUNNER_LABEL=ubuntu-slim"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "RUNNER_NAME=$RUNNER_NAME"
          uname -a
          python --version
