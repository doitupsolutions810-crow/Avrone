name: Ollama Docker sandbox integration

on:
  pull_request:
    branches: [main]
    paths:
      - "avrone/agentcontainer.py"
      - "avrone/agentfs.py"
      - "avrone/sovereign.py"
      - "avrone/server.py"
      - "avrone/trinity.py"
      - "docs/local-ollama/**"
      - "tests/test_builder_sdk.py"
      - "tests/test_server_edges.py"
      - ".github/workflows/ollama-sandbox-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ollama-sandbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-chat-ollama-docker:
    name: Live Chat -> Ollama -> two isolated Docker agents
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AVRONE
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify Docker daemon and prepare sandbox image
        run: |
          docker info
          docker pull python:3.12-slim

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (sudo systemctl start ollama 2>/dev/null || nohup ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 60); do
            curl --noproxy '*' -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 5
          done
          curl --noproxy '*' -fsS http://127.0.0.1:11434/api/tags >/dev/null || {
            cat /tmp/ollama.log 2>/dev/null || true
            exit 1
          }

      - name: Pull tool-capable MiMo-V2.6 smoke-test model
        run: |
          MODEL=mimo-v2.6:9b
          ollama pull "$MODEL"
          ollama --version
          ollama show "$MODEL"
          curl --noproxy '*' -fsS http://127.0.0.1:11434/v1/models
          MODEL="$MODEL" python - <<'PY'
          import json
          import os
          import urllib.request

          model = os.environ["MODEL"]
          request = urllib.request.Request(
              "http://127.0.0.1:11434/api/show",
              data=json.dumps({"model": model}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))
          capabilities = payload.get("capabilities")
          if not isinstance(capabilities, list) or "tools" not in {
              str(value).lower() for value in capabilities
          }:
              raise SystemExit(
                  f"BLOCKED: {model} does not advertise native tool capability: {capabilities!r}"
              )
          print(json.dumps({"model": model, "capabilities": capabilities}, sort_keys=True))
          PY

      - name: Configure isolated local profile
        run: |
          cp docs/local-ollama/local-ollama-sandbox.env.example docs/local-ollama/local-ollama-sandbox.env
          sed -i \
            -e 's/^AVRONE_LLM_MODEL=.*/AVRONE_LLM_MODEL=mimo-v2.6:9b/' \
            -e 's/^AVRONE_LEAD_MODEL=.*/AVRONE_LEAD_MODEL=mimo-v2.6:9b/' \
            -e 's/^AVRONE_LLM_TIMEOUT=.*/AVRONE_LLM_TIMEOUT=360/' \
            docs/local-ollama/local-ollama-sandbox.env
          {
            echo "AVRONE_AGENT_UID=$(id -u)"
            echo "AVRONE_AGENT_GID=$(id -g)"
          } >> docs/local-ollama/local-ollama-sandbox.env
          chmod 600 docs/local-ollama/local-ollama-sandbox.env

      - name: Start AVRONE host control plane
        run: |
          nohup bash docs/local-ollama/start-local-ollama-sandbox.sh > /tmp/avrone-server.log 2>&1 < /dev/null &
          echo $! > /tmp/avrone-server.pid
          for i in $(seq 1 120); do
            if curl --noproxy '*' -fsS http://127.0.0.1:8710/api/status >/tmp/avrone-status.json; then
              cat /tmp/avrone-status.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/avrone-server.log
          exit 1

      - name: Run live two-agent Chat and Docker isolation test
        run: |
          python3 docs/local-ollama/test-local-ollama-squad.py --timeout 1500

      - name: Inspect final run evidence
        if: always()
        run: |
          echo "### Ollama Docker sandbox smoke" >> "$GITHUB_STEP_SUMMARY"
          if [ -d data/local-ollama-smoke ]; then
            for f in data/local-ollama-smoke/*.json; do
              [ -f "$f" ] || continue
              echo "Report: $f" >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "No passing smoke report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "### Server log (last 100 lines)" >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 /tmp/avrone-server.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ollama-docker-sandbox-evidence
          path: |
            data/local-ollama-smoke/*.json
            /tmp/avrone-server.log
            /tmp/avrone-status.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop AVRONE control plane
        if: always()
        run: |
          if [ -f /tmp/avrone-server.pid ]; then
            kill "$(cat /tmp/avrone-server.pid)" 2>/dev/null || true
          fi
