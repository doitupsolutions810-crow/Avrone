name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04    # pinned: ubuntu-latest migrated to Ubuntu 26 on 2026-10-19 (actions/runner-images#14748)
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install avrone (dev)
        run: |
          set -o pipefail
          # Defensive checkout hygiene: some file-delivery layers prepend a
          # status line ("successfully downloaded text file (SHA: ...)") to
          # delivered text files. Line 1 must parse as TOML/JSON/py source, so
          # strip such a wrapper line when present (no-op on clean checkouts).
          python - <<'PY'
from pathlib import Path

prefix = b"successfully downloaded text file"
for path in Path(".").rglob("*"):
    if not path.is_file() or ".git" in path.parts:
        continue
    try:
        data = path.read_bytes()
    except OSError:
        continue
    if data.startswith(prefix):
        _, separator, remainder = data.partition(b"\n")
        if separator:
            path.write_bytes(remainder)
PY
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" 2>&1 | tee /tmp/pip.log || {
            tail -n 8 /tmp/pip.log | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          }
      - name: Test avrone
        run: |
          set -o pipefail
          python - <<'PY'
from pathlib import Path

prefix = b"successfully downloaded text file"
for path in Path(".").rglob("*"):
    if not path.is_file() or ".git" in path.parts:
        continue
    try:
        data = path.read_bytes()
    except OSError:
        continue
    if data.startswith(prefix):
        _, separator, remainder = data.partition(b"\n")
        if separator:
            path.write_bytes(remainder)
PY
          pytest -q 2>&1 | tee /tmp/pytest.log || {
            tail -n 10 /tmp/pytest.log | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          }
        env: { AVRONE_LLM_MODE: mock, AVRONE_RUNNER: local }
