name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04    # pinned: ubuntu-latest migrated to Ubuntu 26 on 2026-10-19 (actions/runner-images#14748)
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install avrone (dev)
        run: |
          set -o pipefail
          # Defensive checkout hygiene: some file-delivery layers prepend a
          # status line ("successfully downloaded text file (SHA: ...)") to
          # delivered text files. Line 1 must parse as TOML/JSON/py source, so
          # strip such a wrapper line when present (no-op on clean checkouts).
          grep -rlI --exclude-dir=.git '^successfully downloaded text file' . 2>/dev/null \
            | while IFS= read -r f; do sed -i '1{/^successfully downloaded text file/d}' "$f"; done
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" 2>&1 | tee /tmp/pip.log || {
            tail -n 8 /tmp/pip.log | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          }
      - name: Test avrone
        run: |
          set -o pipefail
          grep -rlI --exclude-dir=.git '^successfully downloaded text file' . 2>/dev/null \
            | while IFS= read -r f; do sed -i '1{/^successfully downloaded text file/d}' "$f"; done
          pytest -q 2>&1 | tee /tmp/pytest.log || {
            tail -n 10 /tmp/pytest.log | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          }
        env: { AVRONE_LLM_MODE: mock, AVRONE_RUNNER: local }

      - name: Collect test diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          cp /tmp/pip.log diagnostics/pip.log 2>/dev/null || true
          cp /tmp/pytest.log diagnostics/pytest.log 2>/dev/null || true
          python -V > diagnostics/python-version.txt 2>&1 || true
          git status --short > diagnostics/git-status.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: avrone-ci-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
