<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AVRONE</title>
<style>
  :root { --bg:#0b0d12; --panel:#12151d; --line:#232838; --text:#e6e8ef; --dim:#8a90a2; --accent:#7cf2c8; --warn:#f2c97c; --err:#f27c7c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:grid; grid-template-rows:auto 1fr; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; letter-spacing:.2em; margin:0; color:var(--accent); }
  header .meta { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns: 1fr 380px; min-height:0; }
  #chat { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
  #msgs { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:80%; padding:10px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:#1d2a40; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .bot .agents { margin-top:8px; color:var(--dim); font-size:12px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; height:52px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px; font:inherit; }
  select, button, input { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:0 12px; font:inherit; }
  button { background:var(--accent); color:#06120d; border:0; font-weight:600; cursor:pointer; }
  aside { display:flex; flex-direction:column; min-height:0; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; border-radius:0; background:none; color:var(--dim); padding:10px; }
  .tabs button.on { color:var(--accent); box-shadow: inset 0 -2px var(--accent); }
  .pane { flex:1; overflow:auto; padding:10px; display:none; font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pane.on { display:block; }
  .agent { border:1px solid var(--line); border-radius:8px; padding:6px 8px; margin-bottom:6px; }
  .agent .st { float:right; color:var(--warn); } .agent.done .st { color:var(--accent); }
  .ev { border-bottom:1px dashed var(--line); padding:4px 0; white-space:pre-wrap; word-break:break-word; }
  .ev b { color:var(--accent); } .ev.error b { color:var(--err); }
  #termout { white-space:pre-wrap; }
  #termform { display:flex; gap:6px; margin-bottom:8px; } #termform input { flex:1; height:32px; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; grid-template-rows: 1fr 40vh; } #chat { border-right:0; } }
</style>
</head>
<body>
<header><h1>AVRONE</h1><span class="meta" id="meta">connecting…</span></header>
<main>
  <section id="chat">
    <div id="msgs"></div>
    <form id="f">
      <textarea id="q" placeholder="Ask anything. Squad mode runs several agents in parallel, then a lead merges them."></textarea>
      <select id="mode"><option value="squad">Squad</option><option value="chat">Chat</option></select>
      <button>Send</button>
    </form>
  </section>
  <aside>
    <div class="tabs">
      <button data-p="hud" class="on">HUD</button><button data-p="logs">Logs</button><button data-p="term">Terminal</button>
    </div>
    <div class="pane on" id="hud"></div>
    <div class="pane" id="logs"></div>
    <div class="pane" id="term">
      <form id="termform"><input id="tok" type="password" placeholder="admin token" style="max-width:110px" /><input id="cmd" placeholder="command" /></form>
      <div id="termout"></div>
    </div>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
const agents = {};
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function addMsg(text, cls, extra){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; if(extra){ const a=document.createElement('div'); a.className='agents'; a.textContent=extra; d.appendChild(a);} $('#msgs').appendChild(d); $('#msgs').scrollTop=1e9; return d; }
function renderHud(){ $('#hud').innerHTML = Object.entries(agents).reverse().map(([n,a]) =>
  `<div class="agent ${a.status}"><span class="st">${a.status}</span><b>${esc(n)}</b> ${a.parent?'↳ '+esc(a.parent):''}<br>${esc(a.focus||'').slice(0,140)}<br><span style="color:var(--dim)">${esc(a.last||'')}</span></div>`).join('') || '<span style="color:var(--dim)">No agents yet.</span>'; }
async function status(){ try { const s = await (await fetch('/api/status')).json(); $('#meta').textContent = `runner: ${s.runner} · model: ${s.model} @ ${s.backend} · squad: ${s.squad_size}`; } catch(e){ $('#meta').textContent='offline'; } }
function ws(){
  const w = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/events');
  w.onmessage = m => { const e = JSON.parse(m.data);
    if(e.kind==='agent.spawn') agents[e.agent] = {status:'working', focus:e.data.focus, parent:e.data.parent};
    if(e.kind==='tool.call' && agents[e.agent]) agents[e.agent].last = '→ '+e.data.tool+' '+JSON.stringify(e.data.args).slice(0,80);
    if(e.kind==='agent.done' && agents[e.agent]) { agents[e.agent].status='done'; agents[e.agent].last='finished'; }
    renderHud();
    const d=document.createElement('div'); d.className='ev'+(e.kind==='error'?' error':'');
    const body = e.data.output || e.data.result || e.data.answer || e.data.message || JSON.stringify(e.data);
    d.innerHTML = `<b>${esc(e.kind)}</b> ${esc(e.agent)}\n${esc(String(body).slice(0,1200))}`;
    $('#logs').prepend(d);
  };
  w.onclose = () => setTimeout(ws, 1500);
}
$('#f').onsubmit = async ev => { ev.preventDefault(); const q=$('#q').value.trim(); if(!q) return; $('#q').value='';
  addMsg(q,'user'); const pending = addMsg('Agents working…','bot');
  try { const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q, mode:$('#mode').value})});
    const j = await r.json(); pending.remove();
    addMsg(j.answer || JSON.stringify(j), 'bot', j.agents && j.agents.length ? `${j.agents.length} agents: ${j.agents.map(a=>a.role).join(', ')} · run ${j.run_id}` : `run ${j.run_id||''}`);
  } catch(e){ pending.textContent = 'Error: '+e; } };
$('#q').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('#f').requestSubmit(); } });
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { document.querySelectorAll('.tabs button,.pane').forEach(x=>x.classList.remove('on')); b.classList.add('on'); $('#'+b.dataset.p).classList.add('on'); });
$('#termform').onsubmit = async ev => { ev.preventDefault(); const cmd=$('#cmd').value; $('#cmd').value='';
  const r = await fetch('/api/terminal',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':$('#tok').value},body:JSON.stringify({cmd})});
  const j = await r.json(); $('#termout').textContent = (r.ok ? `$ ${j.cmd}\n${j.stdout}${j.stderr?'\n'+j.stderr:''}\n[exit ${j.exit_code}]` : 'Error: '+(j.detail||r.status)) + '\n\n' + $('#termout').textContent; };
renderHud(); status(); ws(); setInterval(status, 10000);
</script>
</body>
</html>
