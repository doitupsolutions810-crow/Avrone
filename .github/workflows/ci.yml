name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04    # pinned: ubuntu-latest migrated to Ubuntu 26 on 2026-10-19 (actions/runner-images#14748)
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install avrone (dev)
        run: |
          set -o pipefail
          # Validate checkout integrity rather than silently mutating source files.
          if grep -rlI --exclude-dir=.git '^successfully downloaded text file' . 2>/dev/null; then
            echo "::error::Unexpected text-delivery metadata found in source checkout; fix the committed files."
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" 2>&1 | tee /tmp/pip.log || {
            tail -n 8 /tmp/pip.log | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          }
      - name: Test avrone
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee /tmp/pytest.log || {
            tail -n 10 /tmp/pytest.log | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          }
        env: { AVRONE_LLM_MODE: mock, AVRONE_RUNNER: local }
