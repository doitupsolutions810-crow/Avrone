name: squad-round-notify

on:
  push:
    branches: [main]
    paths:
      - 'avrone-squad/**'
      - '.github/workflows/squad-round-notify.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect squad-round artifacts
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q '^avrone-squad/'; then
            echo "squad=true" >> $GITHUB_OUTPUT
          else
            echo "squad=false" >> $GITHUB_OUTPUT
          fi
          # Extract version hint from project-doc if present
          VER=$(grep -m1 -oE 'version [0-9]+\.[0-9]+' avrone-squad/project-doc/SKILL.md 2>/dev/null | head -1 || echo "unknown")
          echo "version=$VER" >> $GITHUB_OUTPUT
          # Count tests if a test dir exists
          TC=$(find avrone-squad -name 'test_*.py' -o -name 'test_*.js' 2>/dev/null | wc -l)
          echo "test_files=$TC" >> $GITHUB_OUTPUT

      - name: Open squad-round tracking issue
        if: steps.detect.outputs.squad == 'true'
        env:
          GH_TOKEN: ${{ github.token}}
        run: |
          TITLE="Squad round landed — ${{ steps.detect.outputs.version }} (${{ github.sha }})"
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          cat > "$BODY_FILE" <<'EOF'
          ## Squad round notification (proposal F)

          - **Commit:** `${{ github.sha }}`
          - **Author:** ${{ github.actor}}
          - **Version hint:** ${{ steps.detect.outputs.version}}
          - **Test files touched:** ${{ steps.detect.outputs.test_files}}
          - **Triggered by:** ${{ github.event_name}}

          ### What to verify
          - [ ] `pytest -q avrone-squad` green
          - [ ] Node tests green (`node --test avrone-squad`)
          - [ ] Cherry-pick order A→E respected if new proposals landed
          - [ ] project-doc SKILL.md updated
          - [ ] daily-memory.log appended

          Auto-generated by `.github/workflows/squad-round-notify.yml`. Close when verified.
          EOF
          gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label "avrone,squad-round" || \
          gh issue create --title "$TITLE" --body-file "$BODY_FILE"

      - name: Summary
        run: |
          echo "## Squad-round notify" >> $GITHUB_STEP_SUMMARY
          echo "- Squad artifacts detected: ${{ steps.detect.outputs.squad}}" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ steps.detect.outputs.version}}" >> $GITHUB_STEP_SUMMARY
          echo "- Test files: ${{ steps.detect.outputs.test_files}}" >> $GITHUB_STEP_SUMMARY
          echo "- Tracking issue opened: ${{ steps.detect.outputs.squad == 'true' && 'yes' || 'no (no avrone-squad changes)'}}" >> $GITHUB_STEP_SUMMARY
